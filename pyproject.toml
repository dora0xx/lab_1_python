[project]
name = "lab1"
version = "0.1.0"
description = "CLI calculator and unit converter"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
    "ruff",
    "typer>=0.27.3",
    "pre-commit>=4.7.0",
    "mypy"
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
